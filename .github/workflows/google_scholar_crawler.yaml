name: Get Citation Data

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Anonymous access or imported browser Cookie
        type: choice
        default: anonymous
        options:
          - anonymous
          - cookie
      browser:
        description: Browser used to fetch Google Scholar
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      SCHOLAR_BROWSER: ${{ inputs.browser || 'chromium' }}
      SCHOLAR_AUTH_MODE: ${{ inputs.auth_mode || 'anonymous' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Install selected browser
        run: |
          case "$SCHOLAR_BROWSER" in
            chromium) python -m playwright install --no-shell chromium ;;
            firefox|webkit) python -m playwright install "$SCHOLAR_BROWSER" ;;
            *) echo "Unsupported browser"; exit 1 ;;
          esac

      - name: Test crawler
        working-directory: google_scholar_crawler
        run: python -m unittest discover -p "test_*.py"
        env:
          SCHOLAR_BROWSER_SMOKE: "1"

      - name: Fetch citation data
        working-directory: google_scholar_crawler
        timeout-minutes: 3
        run: python main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          GOOGLE_SCHOLAR_COOKIE: ${{ inputs.auth_mode == 'cookie' && secrets.GOOGLE_SCHOLAR_COOKIE || '' }}

      - name: Publish citation data
        working-directory: google_scholar_crawler/results
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.json
          git commit -m "Update citation data"
          remote_repo="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push "${remote_repo}" HEAD:google-scholar-stats --force
